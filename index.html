<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>zuz-arts</title>
    <meta name="description" content="zuz-arts — modern art and design" />
    <style>
      :root{
        --purple-500: #6C4DE8;
        --purple-300: #9B7BFF;
        --text: #0f1720;
        --muted: #6b7280;
        --glass: rgba(255,255,255,0.08);
      }
      html,body{height:100%;}
      body{
        margin:0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        background: linear-gradient(180deg,#fbf8ff 0%, #f6f6fb 100%);
        color:var(--text);
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }

      /* Header */
      .site-header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:1rem;
        padding:1.25rem 2rem;
        background: linear-gradient(90deg,var(--purple-500), var(--purple-300));
        color:white;
        box-shadow: 0 8px 30px rgba(108,77,232,0.12);
      }

      .brand{
        display:flex;
        align-items:center;
        gap:0.9rem;
      }

      .logo{
        width:56px;
        height:56px;
        flex:0 0 56px;
        border-radius:12px;
        background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)), radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 20%), linear-gradient(135deg,var(--purple-300), var(--purple-500));
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:700;
        font-size:1.05rem;
        letter-spacing:0.6px;
        box-shadow: 0 6px 20px rgba(99,72,219,0.18);
      }

      .site-title{
        display:flex;
        flex-direction:column;
        line-height:1;
      }
      .site-title .main{
        font-size:1.25rem;
        font-weight:700;
        color:rgba(255,255,255,0.98);
      }
      .site-title .tag{
        font-size:0.78rem;
        opacity:0.9;
        margin-top:4px;
        color:rgba(255,255,255,0.9);
        font-weight:600;
      }

      /* Navigation */
      .nav{
        display:flex;
        align-items:center;
        gap:0.75rem;
      }
      .nav a{
        color: rgba(255,255,255,0.95);
        text-decoration:none;
        font-weight:600;
        padding:0.45rem 0.65rem;
        border-radius:8px;
        transition:transform .16s ease, background .16s ease, opacity .16s ease;
      }
      .nav a:hover{ transform:translateY(-3px); opacity:0.98; background: rgba(255,255,255,0.06);} 

      .cta{
        margin-left:0.6rem;
        padding:0.5rem 0.9rem;
        background: rgba(255,255,255,0.12);
        border-radius:999px;
        border: 1px solid rgba(255,255,255,0.08);
        color:white;
        font-weight:700;
        box-shadow: 0 2px 10px rgba(99,72,219,0.12);
      }

      /* Small screens */
      @media (max-width:720px){
        .nav{ display:none; }
        .site-header{ padding:0.9rem 1rem; }
        .logo{ width:48px; height:48px; }
        .site-title .main{ font-size:1rem; }
      }

      /* Simple page hero so header sits nicely */
      .hero{
        padding:3.5rem 2rem;
        display:flex;
        align-items:center;
        justify-content:center;
      }
      .hero-card{
        max-width:1000px;
        width:100%;
        background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.85));
        border-radius:14px;
        padding:2.2rem;
        box-shadow: 0 10px 40px rgba(17,24,39,0.06);
        display:flex;
        gap:1.5rem;
        align-items:center;
        justify-content:space-between;
      }
      .hero-card h1{ margin:0; font-size:2rem; color:var(--text); }
      .hero-card p{ margin:0.4rem 0 0; color:var(--muted); }

    </style>
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="brand">
        <div class="logo" aria-hidden="true">ZA</div>
        <div class="site-title">
          <div class="main">zuz-arts</div>
          <div class="tag">modern • elegant • purple</div>
        </div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <a href="#works">Works</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a class="cta" href="#explore">Explore</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-card">
          <div>
            <h1>Welcome to zuz-arts</h1>
            <p>Minimal portfolio and gallery — a clean canvas for your work with a refined purple accent.</p>
          </div>
          <div style="text-align:right; min-width:220px;">
            <p style="margin:0;font-weight:700;color:var(--purple-500);">Showcase your art</p>
            <p style="margin:6px 0 0;color:var(--muted);">Easy to customize. Responsive and elegant by default.</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
